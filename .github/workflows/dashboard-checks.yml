name: Dashboard checks
on:
  push:
    branches: [main, codex/dashboard-activity-cards]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The existing npm lockfile predates the current dependencies.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run build
